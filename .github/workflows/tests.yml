name: Takt Engine tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install GTK3 and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 xvfb xauth
      - name: Run project tests with GTK smoke test
        env:
          PATH: /usr/bin:/bin
        run: xvfb-run -a bash scripts/test.sh
