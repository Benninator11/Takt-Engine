name: Unpack Takt Engine source
on:
  push:
    branches: [main]
    paths:
      - '.source-upload/**'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: "!contains(github.event.head_commit.message, '[unpacked]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and unpack archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .source-upload/part-00.b64 \
            .source-upload/part-01.b64 \
            .source-upload/part-02a.b64 \
            .source-upload/part-02b.b64 \
            .source-upload/part-03a.b64 \
            .source-upload/part-03b.b64 \
            .source-upload/part-04a.b64 \
            .source-upload/part-04b.b64 \
            .source-upload/part-05a.b64 \
            .source-upload/part-05b.b64 \
            .source-upload/part-06a.b64 \
            .source-upload/part-06b.b64 \
            .source-upload/part-07a.b64 \
            .source-upload/part-07b.b64 \
            .source-upload/part-08a.b64 \
            .source-upload/part-08b.b64 \
            .source-upload/part-09a.b64 \
            .source-upload/part-09b.b64 \
            .source-upload/part-10a.b64 \
            .source-upload/part-10b.b64 \
            .source-upload/part-11a.b64 \
            .source-upload/part-11b.b64 \
            .source-upload/part-12a.b64 \
            .source-upload/part-12b.b64 \
            .source-upload/part-13a.b64 \
            .source-upload/part-13b.b64 \
            .source-upload/part-14a.b64 \
            .source-upload/part-14b.b64 \
            .source-upload/part-15a.b64 > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64 | tr -d ' ')" = "109784"
          base64 -d /tmp/source.b64 > /tmp/source.zip
          unzip -t /tmp/source.zip
          mkdir /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          test -d /tmp/source/Takt-Engine
          cp -a /tmp/source/Takt-Engine/. .
          rm -rf .source-upload
          rm -f .github/workflows/unpack-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Takt Engine 1.2.4 source [unpacked]'
          git push
