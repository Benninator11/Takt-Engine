[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "takt-engine"
version = "1.5.2"
description = "GTK3-Oberfläche für Raspberry-Pi-Taktprofile, Lüfterkurven, Diagnose, Live-Monitoring und Stabilitätstests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Benninator111"}]

[project.scripts]
takt-engine = "takt_engine.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
takt_engine = ["data/*.json"]
